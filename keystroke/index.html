<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Keystroke Authentication</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h2>Healthcare Access Control</h2>

        <h3>Behavioral Biometric Authentication</h3>

        <p>
            Type the following phrase exactly as shown:
        </p>

        <div id="phrase">

            .tie5Roanl

        </div>

        <input
            id="typingBox"
            type="text"
            placeholder="Type here..."
            autocomplete="off"
            spellcheck="false"
        >

        <br>

        <button id="clearButton">

            Clear

        </button>

        <button id="submitButton">

            Submit

        </button>

        <div id="status">

            Waiting for typing...

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
